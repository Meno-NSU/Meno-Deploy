# Grafana for Meno. Served under /grafana/ behind nginx.
[server]
# Loopback only; nginx is the sole way in. On this host the upstream firewall
# is permissive, so any other bind address publishes Grafana to the internet.
http_addr = 127.0.0.1
http_port = 3000
domain = meno.nsu.ru
root_url = https://meno.nsu.ru/grafana/
serve_from_sub_path = true

[security]
cookie_secure = true

[auth.anonymous]
# nginx Basic Auth is the outer gate; Grafana's own login is the inner one.
# Two independent barriers, so neither one failing opens the dashboard.
enabled = false

[users]
# No self-service signup: this is an internal dashboard for a named few.
allow_sign_up = false
allow_org_create = false

[analytics]
reporting_enabled = false
check_for_updates = false

[plugins]
# Separate setting from check_for_updates, and it defaults to true — without
# this Grafana still makes outbound calls to grafana.com on every start.
check_for_plugin_updates = false
