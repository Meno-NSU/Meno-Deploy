name: meno-ragu-backend
x-core: &core
  image: ${CORE_IMAGE:-meno-ragu-core:local}
  build:
    context: ${CORE_SOURCE_DIR:-../meno_ragu_stand}
  env_file:
    - path: ${BACKEND_ENV_FILE:-.env.backend}
      required: true
  environment:
    APP_ENV: production
    APP_HOST: 127.0.0.1
    APP_PORT: ${BACKEND_PORT:-9007}
    AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Run scripts/backend.sh init}
    DATABASE_URL: postgresql+asyncpg://meno:${BACKEND_POSTGRES_PASSWORD:?Run scripts/backend.sh init}@127.0.0.1:${BACKEND_POSTGRES_PORT:-15432}/meno
    REDIS_URL: redis://127.0.0.1:${BACKEND_REDIS_PORT:-16379}/0
    STAND_RESOURCES_DIR: /app/data
    QDRANT_URL: http://127.0.0.1:${QDRANT_HTTP_PORT:-6333}
    LOG_CONTENT_PREVIEWS: "false"
    QA_FEWSHOTS_ENABLED: "false"
    CAPTURE_PIPELINE_TRACE: "false"
  volumes:
    - type: bind
      source: ${KNOWLEDGE_DIR:?Set KNOWLEDGE_DIR in .env.backend}
      target: /app/data
      read_only: true
      bind:
        create_host_path: false
    - core-cache:/app/var
  network_mode: host
  init: true
  logging: &logging
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"
services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: meno
      POSTGRES_USER: meno
      POSTGRES_PASSWORD: ${BACKEND_POSTGRES_PASSWORD:?Run scripts/backend.sh init}
    ports: ["127.0.0.1:${BACKEND_POSTGRES_PORT:-15432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U meno -d meno']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, "yes"]
    ports: ["127.0.0.1:${BACKEND_REDIS_PORT:-16379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
  migrate:
    <<: *core
    command: [meno-rag-migrate]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  core:
    <<: *core
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['APP_PORT'] + '/readyz', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  core-cache:
