# Websocket upgrade helper for the Grafana location.
#
# `map` is an http-context directive, so like the benchmark token map it lives
# in conf.d rather than in the vhost. Sending a literal "upgrade" instead would
# put `Connection: upgrade` on plain GETs that carry no Upgrade header —
# malformed HTTP/1.1 that some upstreams reject.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
