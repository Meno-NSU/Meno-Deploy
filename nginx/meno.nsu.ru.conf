# Production vhost for meno.nsu.ru — TLS edge in front of the Meno-Web
# Express server on 127.0.0.1:9012.
# Design: docs/superpowers/specs/2026-06-17-meno-deploy-design.md

server {
    # HTTP: serve ACME renewals, redirect everything else to HTTPS.
    listen 80;
    listen [::]:80;
    server_name meno.nsu.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTPS: TLS termination and reverse proxy.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meno.nsu.ru;

    ssl_certificate     /etc/letsencrypt/live/meno.nsu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meno.nsu.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Public launch ─────────────────────────────────────────────────────
    # The closed-pilot access gate (shared-token HTTP Basic Auth on this server
    # block) was removed after InfoSec sign-off — the site is now public. The
    # app's own email/password login still applies. To re-gate (e.g. a future
    # restricted preview), restore the two directives below and create the token
    # file with scripts/set-gate-token.sh:
    #     auth_basic           "Menon — restricted";
    #     auth_basic_user_file /etc/nginx/.meno_htpasswd;
    # NOTE: the site is public ONLY through nginx :443. The app ports must stay
    # loopback-only (Express :9012 → 127.0.0.1, backend :9006 → 127.0.0.1); a
    # 0.0.0.0 bind would expose the app directly, past this edge.

    access_log /var/log/nginx/meno.nsu.ru.access.log;
    error_log  /var/log/nginx/meno.nsu.ru.error.log;

    client_max_body_size 25m;

    # ── Hidden benchmark endpoint ─────────────────────────────────────────
    # OpenAI-compatible path for benchmark runs, for developers only. Proxies
    # straight to the backend, bypassing Express, so benchmark traffic never
    # touches the frontend's session logic.
    #
    # $bench_ok comes from the map in /etc/nginx/conf.d/meno-bench-token.conf
    # (a placeholder that is always 0 until scripts/set-bench-token.sh runs).
    #
    # 404, not 401/403: without the token the path must be indistinguishable
    # from one that does not exist, so a scanner finds nothing. `if` + `return`
    # is one of the two officially safe uses of `if` in nginx.
    #
    # No rate limit on purpose: it would fight the benchmark, which is meant to
    # hammer the endpoint. Concurrency is bounded by the backend's separate
    # bench admission budget (BENCH_MAX_CONCURRENT) instead.
    location /bench/v1/ {
        if ($bench_ok = 0) { return 404; }
        proxy_pass http://127.0.0.1:9006/v1/;
        include snippets/meno-proxy.conf;
        include snippets/meno-sse.conf;
    }

    # Raw Prometheus metrics for ad-hoc debugging, same token. Routine
    # collection does NOT go through here — Prometheus scrapes 127.0.0.1:9006
    # over the loopback and never crosses the public edge.
    location = /bench/metrics {
        if ($bench_ok = 0) { return 404; }
        proxy_pass http://127.0.0.1:9006/metrics;
        include snippets/meno-proxy.conf;
    }

    # API + SSE streaming chat.
    location /v1/ {
        proxy_pass http://127.0.0.1:9012;
        include snippets/meno-proxy.conf;
        include snippets/meno-sse.conf;
    }

    # Static assets + SPA fallback (served by the Express server).
    location / {
        proxy_pass http://127.0.0.1:9012;
        include snippets/meno-proxy.conf;
    }
}
