# Production vhost for meno.nsu.ru — TLS edge in front of the Meno-Web
# Express server on 127.0.0.1:9012.
# Design: docs/superpowers/specs/2026-06-17-meno-deploy-design.md

server {
    # HTTP: serve ACME renewals, redirect everything else to HTTPS.
    listen 80;
    listen [::]:80;
    server_name meno.nsu.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTPS: TLS termination and reverse proxy.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meno.nsu.ru;

    ssl_certificate     /etc/letsencrypt/live/meno.nsu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meno.nsu.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Public launch ─────────────────────────────────────────────────────
    # The closed-pilot access gate (shared-token HTTP Basic Auth on this server
    # block) was removed after InfoSec sign-off — the site is now public. The
    # app's own email/password login still applies. To re-gate (e.g. a future
    # restricted preview), restore the two directives below and create the token
    # file with scripts/set-gate-token.sh:
    #     auth_basic           "Menon — restricted";
    #     auth_basic_user_file /etc/nginx/.meno_htpasswd;
    # If you do restore it, note the benchmark locations below already carry
    # `auth_basic off` — without it they inherit the gate, nginx consumes their
    # Authorization header as Basic credentials, and every bench request 401s.
    # NOTE: the site is public ONLY through nginx :443. The app ports must stay
    # loopback-only (Express :9012 → 127.0.0.1, backend :9006 → 127.0.0.1); a
    # 0.0.0.0 bind would expose the app directly, past this edge.

    access_log /var/log/nginx/meno.nsu.ru.access.log;
    error_log  /var/log/nginx/meno.nsu.ru.error.log;

    client_max_body_size 25m;

    # ── Hidden benchmark endpoint ─────────────────────────────────────────
    # OpenAI-compatible path for benchmark runs, for developers only. Proxies
    # straight to the backend, bypassing Express, so benchmark traffic never
    # touches the frontend's session logic.
    #
    # $bench_ok comes from the map in /etc/nginx/conf.d/meno-bench-token.conf
    # (a placeholder that is always 0 until scripts/set-bench-token.sh runs).
    #
    # Concealment: an unauthenticated request is handed to Express and gets the
    # SPA, byte-identical to any other unknown path. A bare 404 would NOT hide
    # anything — Express answers 200 + index.html for every unmatched path, so a
    # 404 here would be the one response shape that proves something exists.
    # 418 is just an internal signal to reach @bench_hidden; it never goes out.
    #
    # auth_basic off is a no-op today (the closed-pilot gate was removed) and is
    # here on purpose: the re-gate recipe above adds auth_basic to the whole
    # server block, which these locations would inherit. nginx would then eat
    # the Authorization header as Basic credentials and 401 every bench request
    # — the same header collision that once 401-stormed logged-in users.
    #
    # No rate limit on purpose: it would fight the benchmark, which is meant to
    # hammer the endpoint. Concurrency is bounded by the backend's separate
    # bench admission budget (BENCH_MAX_CONCURRENT) instead.
    location /bench/v1/ {
        auth_basic off;
        error_page 418 = @bench_hidden;
        if ($bench_ok = 0) { return 418; }
        proxy_pass http://127.0.0.1:9006/v1/;
        include snippets/meno-proxy.conf;
        include snippets/meno-sse.conf;
    }

    # Without this exact-match location, nginx answers /bench/v1 (no trailing
    # slash) with a 301 to /bench/v1/ during the find-config phase — before the
    # rewrite phase where the token check runs. That redirect is a free
    # existence oracle for an unauthenticated scanner. Handing the bare path to
    # Express makes it indistinguishable from /bench/v2 or any other unknown URI.
    location = /bench/v1 {
        auth_basic off;
        proxy_pass http://127.0.0.1:9012;
        include snippets/meno-proxy.conf;
    }

    # Raw Prometheus metrics for ad-hoc debugging, same token. Routine
    # collection does NOT go through here — Prometheus scrapes 127.0.0.1:9006
    # over the loopback and never crosses the public edge.
    location = /bench/metrics {
        auth_basic off;
        error_page 418 = @bench_hidden;
        if ($bench_ok = 0) { return 418; }
        proxy_pass http://127.0.0.1:9006/metrics;
        include snippets/meno-proxy.conf;
    }

    # Where an unauthenticated benchmark request goes: the SPA, same as any
    # unknown path.
    location @bench_hidden {
        proxy_pass http://127.0.0.1:9012;
        include snippets/meno-proxy.conf;
    }

    # ── Grafana ───────────────────────────────────────────────────────────
    # Two independent barriers: nginx Basic Auth (outer) and Grafana's own
    # login (inner). Basic Auth rather than the bench token because a browser
    # cannot be told to send `Authorization: Bearer`, while it handles a Basic
    # realm natively.
    #
    # Its own realm and its own htpasswd — unrelated to the removed
    # closed-pilot gate, and unaffected by restoring it.
    #
    # A missing auth_basic_user_file does NOT fail `nginx -t`; it fails at
    # request time with a 500. deploy.sh therefore installs a locked-account
    # placeholder (password field `*`, which nothing can match) when no real
    # file exists, so an unconfigured host answers 401 rather than 500 — and,
    # more importantly, so the absence of monitoring never blocks deploying the
    # public site.
    location /grafana/ {
        auth_basic           "Meno monitoring";
        auth_basic_user_file /etc/nginx/.meno_grafana_htpasswd;
        proxy_pass http://127.0.0.1:3000;
        include snippets/meno-proxy.conf;
    }

    # Grafana's live tailing and alerting use websockets, which need the
    # Upgrade/Connection headers that meno-proxy.conf deliberately clears.
    location /grafana/api/live/ {
        auth_basic           "Meno monitoring";
        auth_basic_user_file /etc/nginx/.meno_grafana_htpasswd;
        proxy_pass http://127.0.0.1:3000;
        include snippets/meno-proxy.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API + SSE streaming chat.
    location /v1/ {
        proxy_pass http://127.0.0.1:9012;
        include snippets/meno-proxy.conf;
        include snippets/meno-sse.conf;
    }

    # Static assets + SPA fallback (served by the Express server).
    location / {
        proxy_pass http://127.0.0.1:9012;
        include snippets/meno-proxy.conf;
    }
}
