services:
  prometheus:
    image: prom/prometheus:v3.2.1
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=90d]
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - prometheus-data:/prometheus
    networks: [meno]
    restart: unless-stopped
  usage-init:
    image: postgres:16.6-bookworm
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Set GRAFANA_DB_PASSWORD}
    volumes:
      - ./docker/monitoring/init-usage.sh:/init-usage.sh:ro
    command: [sh, /init-usage.sh]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [meno]
    restart: "no"
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${SERVER_NAME:-meno.nsu.ru}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Set GRAFANA_DB_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/monitoring/datasources.yml:/etc/grafana/provisioning/datasources/meno.yml:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      usage-init: {condition: service_completed_successfully}
    networks: [meno]
    restart: unless-stopped
volumes:
  prometheus-data:
  grafana-data:
