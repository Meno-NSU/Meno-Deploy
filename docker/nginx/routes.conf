proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_read_timeout 600s;
proxy_send_timeout 600s;
location /v1/ {
    proxy_pass http://core:9006;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
}
location /bench/v1/ {
    error_page 418 = @bench_hidden;
    if ($bench_ok = 0) { return 418; }
    proxy_pass http://core:9006/v1/;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
}
location = /bench/metrics {
    error_page 418 = @bench_hidden;
    if ($bench_ok = 0) { return 418; }
    proxy_pass http://core:9006/metrics;
}
location = /bench/v1 { proxy_pass http://web:9012; }
location @bench_hidden { proxy_pass http://web:9012; }
location = /metrics { return 404; }
location / { proxy_pass http://web:9012; }
location /grafana/ {
    resolver 127.0.0.11 valid=30s;
    set $grafana http://grafana:3000;
    proxy_pass $grafana;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
