global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/prometheus-rules.yml
scrape_configs:
  - job_name: meno-rag-api
    static_configs:
      - targets: [core:9006]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
