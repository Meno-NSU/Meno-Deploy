apiVersion: 1
datasources:
  - name: Prometheus
    uid: meno-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: PostgreSQL (usage)
    uid: meno-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: meno
    user: meno_grafana
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
